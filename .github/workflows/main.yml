name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master, dev ]

env:
  # Isi dengan hash commit repo maxrave-dev/core yang cocok dengan composeApp ini.
  # Kosong = pakai versi terbaru (saat ini tidak cocok, bikin 4 error di ViewModel).
  CORE_REF: ""

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Ambil modul core jika belum ada
        run: |
          if [ ! -d core/service/loginSync ]; then
            rm -rf core
            git clone https://github.com/maxrave-dev/core.git core
            if [ -n "$CORE_REF" ]; then git -C core checkout "$CORE_REF"; fi
          fi
          ls core core/service

      # Kode app memanggil getListTrackVideoId() dan removeTrackFromLocalPlaylist() TANPA pairId.
      # Kalau CORE_REF kosong, cari commit core terbaru yang masih punya API seperti itu.
      - name: Pilih versi core yang cocok
        run: |
          if [ -z "$CORE_REF" ] && [ -d core/.git ]; then
            for c in $(git -C core rev-list HEAD --max-count=600); do
              git -C core checkout -q "$c"
              if grep -rq "fun getListTrackVideoId" core/domain \
                 && ! grep -rzqP "fun removeTrackFromLocalPlaylist\([^)]*pairId" core/domain; then
                echo "Core dipakai: $(git -C core log -1 --format='%H %ad')"
                found=1
                break
              fi
            done
            [ -n "$found" ] || echo "Tidak ketemu commit cocok, pakai terakhir yang dicek"
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Siapkan properti build
        run: |
          echo "" >> gradle.properties
          echo "isFullBuild=true" >> gradle.properties
          : > local.properties
          echo "SENTRY_DSN=" >> local.properties
          echo "SENTRY_AUTH_TOKEN=" >> local.properties
          echo "LASTFM_API_KEY=" >> local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "DISCORD_CLIENT_ID=" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build APK debug
        run: ./gradlew androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: androidApp/build/outputs/apk/debug/*.apk
