name: Laporan bug
description: Laporkan kesalahan pada Auralys
title: "[Bug] "
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melapor. Sertakan versi aplikasi dan langkah reproduksi.
  - type: input
    id: version
    attributes:
      label: Versi Auralys
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Perangkat & Android
      placeholder: "Redmi Note 12, Android 13"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: |
        1. Buka Beranda
        2. Tekan Putar semua
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Yang diharapkan
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log (opsional)
      render: shell
